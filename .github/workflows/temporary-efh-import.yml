name: Temporary EFH production asset import

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-efh-import.yml'

permissions:
  contents: write

jobs:
  import-dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: efh-public-assets
      - name: Download and verify artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -fL 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-822c-8211-b93f-1acae4475ad2/raw?se=2026-09-05T12%3A25%3A59Z&sp=r&sv=2026-02-06&sr=b&scid=a23e41f9-b6a5-5e66-9152-72a17e4da382&skoid=3cb6de21-012a-49c9-9402-a1ebf8d0bd06&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-05T02%3A40%3A18Z&ske=2026-09-06T02%3A40%3A18Z&sks=b&skv=2026-02-06&sig=7VGiVKoRRK/ALMHsyCeg0AlBBm4EyTDQNR9ctRqXYv8%3D' -o /tmp/efh-dist.zip
          echo '9219115ec44f7b4c62e0115009c9b0596d97241ff5a7f8dd03b7e48d2767478c  /tmp/efh-dist.zip' | sha256sum -c -
          rm -rf efh-v1
          mkdir -p efh-v1
          unzip -q /tmp/efh-dist.zip -d efh-v1
          test -f efh-v1/index.html
          test -f efh-v1/assets/index-CL45wjoP.js
          test -f efh-v1/assets/index-D0HV-3GU.css
      - name: Commit public deployment assets to isolated branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add efh-v1
          git commit -m 'Publish verified Earn From Home P4 production assets'
          git push origin HEAD:efh-public-assets
